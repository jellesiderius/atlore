name: atlore

services:
  postgres:
    image: postgres:17.11-alpine3.24
    restart: unless-stopped
    environment:
      POSTGRES_DB: atlore
      POSTGRES_USER: atlore
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-atlore}
    ports:
      - '${HOST_BIND_ADDRESS:-127.0.0.1}:${POSTGRES_PORT:-55432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U atlore -d atlore']
      interval: 5s
      timeout: 4s
      retries: 15
    security_opt:
      - no-new-privileges:true

  redis:
    image: redis:7.4.11-alpine
    restart: unless-stopped
    command:
      [
        'redis-server',
        '--appendonly',
        'yes',
        '--maxmemory',
        '256mb',
        '--maxmemory-policy',
        'allkeys-lru'
      ]
    ports:
      - '${HOST_BIND_ADDRESS:-127.0.0.1}:${REDIS_PORT:-6379}:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 15
    security_opt:
      - no-new-privileges:true

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-atlore}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-atlore-development-secret}
    ports:
      - '${HOST_BIND_ADDRESS:-127.0.0.1}:${MINIO_PORT:-9000}:9000'
      - '${HOST_BIND_ADDRESS:-127.0.0.1}:${MINIO_CONSOLE_PORT:-9001}:9001'
    volumes:
      - minio_data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 4s
      retries: 20
    security_opt:
      - no-new-privileges:true

  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ['/bin/sh', '-c']
    command:
      - >-
        mc alias set local http://minio:9000 "$${S3_ACCESS_KEY}" "$${S3_SECRET_KEY}" &&
        mc mb --ignore-existing local/atlore &&
        mc anonymous set none local/atlore
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-atlore}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-atlore-development-secret}
    restart: 'no'

  migrate:
    build:
      context: .
      target: builder
    command: npm run db:migrate
    environment:
      DATABASE_URL: postgres://atlore:${POSTGRES_PASSWORD:-atlore}@postgres:5432/atlore
      REALTIME_SECRET: ${REALTIME_SECRET:-atlore-local-realtime-secret-change-me-2026}
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'

  app:
    build:
      context: .
      target: runner
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      PORT: 3000
      ORIGIN: ${ORIGIN:-http://localhost:3000}
      TRUSTED_ORIGINS: ${TRUSTED_ORIGINS:-}
      DATABASE_URL: postgres://atlore:${POSTGRES_PASSWORD:-atlore}@postgres:5432/atlore
      REDIS_URL: redis://redis:6379
      REALTIME_SECRET: ${REALTIME_SECRET:-atlore-local-realtime-secret-change-me-2026}
      S3_ENDPOINT: http://minio:9000
      S3_REGION: ${S3_REGION:-eu-west-1}
      S3_BUCKET: atlore
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-atlore}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-atlore-development-secret}
      SESSION_COOKIE_NAME: atlore_session
      SESSION_TTL_DAYS: ${SESSION_TTL_DAYS:-30}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-12}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-Atlore <noreply@atlore.local>}
    ports:
      - '${HOST_BIND_ADDRESS:-127.0.0.1}:${APP_PORT:-3000}:3000'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
    security_opt:
      - no-new-privileges:true

  cloudflared:
    image: ${CLOUDFLARED_IMAGE:-cloudflare/cloudflared:latest}
    profiles: ['tunnel']
    pull_policy: always
    restart: unless-stopped
    command: ['tunnel', '--no-autoupdate', 'run']
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARED_TUNNEL_TOKEN:-}
      TUNNEL_TRANSPORT_PROTOCOL: ${CLOUDFLARED_PROTOCOL:-auto}
    depends_on:
      app:
        condition: service_healthy
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  postgres_data:
  redis_data:
  minio_data:
